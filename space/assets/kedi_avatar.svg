<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="LittleKedi, an orange tabby cat wearing reading glasses">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFF4E2"/>
      <stop offset="100%" stop-color="#F6D9B4"/>
    </radialGradient>
    <radialGradient id="fur" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#F5A85C"/>
      <stop offset="100%" stop-color="#E0843A"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <circle cx="64" cy="64" r="62" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="61" fill="none" stroke="#C8673A" stroke-width="2.5"/>

  <!-- ears -->
  <path d="M27 58 L33 17 L58 43 Z" fill="url(#fur)" stroke="#B45E28" stroke-width="2" stroke-linejoin="round"/>
  <path d="M101 58 L95 17 L70 43 Z" fill="url(#fur)" stroke="#B45E28" stroke-width="2" stroke-linejoin="round"/>
  <path d="M34 50 L37 27 L51 42 Z" fill="#F7B6B0"/>
  <path d="M94 50 L91 27 L77 42 Z" fill="#F7B6B0"/>

  <!-- head -->
  <ellipse cx="64" cy="72" rx="40" ry="33" fill="url(#fur)" stroke="#B45E28" stroke-width="2"/>

  <!-- tabby stripes -->
  <path d="M64 41 L64 53" stroke="#B45E28" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M55 43 L57 52" stroke="#B45E28" stroke-width="3" stroke-linecap="round"/>
  <path d="M73 43 L71 52" stroke="#B45E28" stroke-width="3" stroke-linecap="round"/>
  <path d="M26 72 L36 74" stroke="#B45E28" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M102 72 L92 74" stroke="#B45E28" stroke-width="2.6" stroke-linecap="round"/>

  <!-- muzzle -->
  <ellipse cx="64" cy="86" rx="17" ry="12" fill="#FFF1E0"/>

  <!-- eyes -->
  <ellipse cx="49" cy="68" rx="7.5" ry="8.5" fill="#7DBE6A"/>
  <ellipse cx="79" cy="68" rx="7.5" ry="8.5" fill="#7DBE6A"/>
  <ellipse cx="49" cy="68.5" rx="2.6" ry="6.5" fill="#2B2320"/>
  <ellipse cx="79" cy="68.5" rx="2.6" ry="6.5" fill="#2B2320"/>
  <circle cx="51.5" cy="64.5" r="1.9" fill="#FFFFFF"/>
  <circle cx="81.5" cy="64.5" r="1.9" fill="#FFFFFF"/>

  <!-- reading glasses -->
  <circle cx="49" cy="68" r="12" fill="none" stroke="#3A2A22" stroke-width="2.6"/>
  <circle cx="79" cy="68" r="12" fill="none" stroke="#3A2A22" stroke-width="2.6"/>
  <path d="M61 67 Q64 63.5 67 67" fill="none" stroke="#3A2A22" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M37 66 L29 63" stroke="#3A2A22" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M91 66 L99 63" stroke="#3A2A22" stroke-width="2.2" stroke-linecap="round"/>

  <!-- nose and mouth -->
  <path d="M60 81 L68 81 L64 86 Z" fill="#E46F7E" stroke="#C25563" stroke-width="1" stroke-linejoin="round"/>
  <path d="M64 86 Q64 91 58.5 91.5 M64 86 Q64 91 69.5 91.5" fill="none" stroke="#3A2A22" stroke-width="1.8" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#7A4A2A" stroke-width="1.3" stroke-linecap="round" opacity="0.85">
    <path d="M46 85 L24 82"/>
    <path d="M46 89 L25 91"/>
    <path d="M82 85 L104 82"/>
    <path d="M82 89 L103 91"/>
  </g>
</svg>
